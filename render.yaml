services:
  - type: web
    name: arcana-evidryx
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn evidryx.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: evidryx-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: EVIDRYX_DATA_DIR
        value: /var/data
      - key: EVIDRYX_EVIDENCE_ROOTS
        value: /var/data/evidence
